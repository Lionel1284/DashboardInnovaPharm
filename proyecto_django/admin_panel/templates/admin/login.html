{% extends 'admin/base.html' %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5" id="login-card">
                <div class="card-header">
                    <h3 class="text-center">Iniciar Sesión</h3>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger" role="alert" id="error-alert">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <!-- Overlay de carga -->
                    <div id="loading-overlay" class="loading-overlay">
                        <div class="loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-3 text-center">Iniciando sesión...</p>
                        </div>
                    </div>
                    
                    <form method="post" id="login-form" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="login-btn">
                            <span id="btn-text">Ingresar</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    border-radius: 0.375rem;
}

.loading-spinner {
    text-align: center;
    color: #0d6efd;
}

.card {
    position: relative;
    overflow: hidden;
}

.btn-loading {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('login-form');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const card = document.getElementById('login-card');
    const hasError = document.getElementById('error-alert') !== null;

    // Manejar envío del formulario
    form.addEventListener('submit', function(e) {
        // Verificar que el token CSRF esté presente
        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]');
        if (!csrfToken || !csrfToken.value) {
            console.error('Token CSRF no encontrado');
            alert('Error de seguridad. Por favor, recarga la página.');
            e.preventDefault();
            return;
        }

        // Mostrar animación
        showLoading();
        
        // Permitir que el formulario se envíe normalmente
        // No usar e.preventDefault() aquí
    });

    function showLoading() {
        loadingOverlay.style.display = 'flex';
        btnText.textContent = 'Iniciando...';
        btnSpinner.classList.remove('d-none');
        loginBtn.disabled = true;
        loginBtn.classList.add('btn-loading');
    }

    function hideLoading() {
        loadingOverlay.style.display = 'none';
        btnText.textContent = 'Ingresar';
        btnSpinner.classList.add('d-none');
        loginBtn.disabled = false;
        loginBtn.classList.remove('btn-loading');
    }

    // Ocultar loading si hay error
    if (hasError) {
        hideLoading();
    }
});
</script>
{% endblock %}
